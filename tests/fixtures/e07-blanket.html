<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>E-07 blanket rules</title>
<style>
body{background:#fff;color:#111;font-family:system-ui;padding:16px;margin:0}
.overlay{position:fixed;inset:0;background:transparent}
a.btn{display:inline-block;background:#1a73e8;color:#fff;padding:8px 16px;text-decoration:none}
.pill{background:#f1f3f4;border-radius:20px;padding:6px 12px;display:inline-block}
.pill input{background:transparent;border:0;outline:0}
</style></head>
<body>
<div class="overlay" id="overlay" role="dialog" aria-label="overlay"></div>
<p><a class="btn" id="buy" href="#">Buy now</a></p>
<div class="pill" id="pill"><input id="search" placeholder="Search"></div>
</body></html>
