<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Hover and focus states</title>
<style>
body{background:#fff;color:#111;font-family:system-ui;padding:16px}
.btn{display:inline-block;background:#fff;color:#111;padding:8px 14px;border:1px solid #ccc;text-decoration:none}
.btn:hover{background:#e8f0fe;color:#0b3d91}
@media (min-width: 1px){ .row:hover{background:#f1f3f4} }
.row{padding:8px}
input.field{background:#fff;color:#111}
input.field:focus{background:#fffbe6;color:#222;border-color:#d4a000}
</style></head>
<body>
<a class="btn" id="btn" href="#">Hover me</a>
<div class="row" id="row">Hoverable row</div>
<input class="field" id="field" value="focus me">
</body></html>
