<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>E-08 borders</title>
<style>
body{background:#fff;color:#111;font-family:system-ui;padding:16px}
#tri{width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-top:0 solid transparent;border-bottom:10px solid #c00}
#ghost{border:1px solid transparent;padding:6px 12px;background:#fff}
#row{border-bottom:1px solid #eee;padding:8px}
</style></head>
<body>
<div id="tri"></div>
<button id="ghost">Ghost</button>
<div id="row">Row with a bottom rule</div>
</body></html>
