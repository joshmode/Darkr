<html lang="en"><head><meta charset="utf-8"><title>B5 text shadow</title>
<style>body{background:#fff;color:#111;font-family:system-ui;padding:16px}

<body><p id="halo">Halo text</p><p id="dark">Dark shadow text</p></body></html>
