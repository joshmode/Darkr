<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Form fixture</title><style>body{background:#fff;color:#111;font-family:system-ui;padding:30px}input,textarea,select,button{font:inherit;padding:8px;border:1px solid #aaa;background:#fff;color:#111;margin:5px}textarea{display:block;width:100%;height:100px}</style></head>
<body><h1>Form controls</h1><form><label>Name <input id="name" value="Ada Lovelace"></label><label>Search <input type="search" placeholder="Search"></label><label>Notes <textarea id="notes">Editable content</textarea></label><select><option>One</option><option>Two</option></select><button>Submit</button></form></body>
</html>
